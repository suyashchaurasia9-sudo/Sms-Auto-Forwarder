name: Build And Publish Android Apk

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile, Package And Publish Apk
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set Up Java Development Kit 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set Up Android Sdk Environment
      uses: android-actions/setup-android@v4

    - name: Ensure Gradle Wrapper Jar Exists
      run: |
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          echo "[*] Downloading official gradle-wrapper.jar..."
          mkdir -p gradle/wrapper
          curl -Lo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar
        fi

    - name: Make Gradle Wrapper Executable
      run: chmod +x gradlew

    - name: Generate Official Release Keystore
      run: |
        keytool -genkey -v -keystore app/release.keystore \
          -alias smsforwarder \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=SmsAutoForwarder, OU=Production, O=SmsForwarder, L=Global, S=Global, C=US"

    - name: Build Debug And Release Apks
      run: ./gradlew assembleDebug assembleRelease

    - name: Upload Debug Apk Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmsForwarder-Debug-Apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload Release Apk Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmsForwarder-Release-Apk
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 30

    - name: Purge All Previous GitHub Releases And Tags
      if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      run: |
        echo "[*] Querying all existing releases for deletion..."
        RELEASES=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/releases | jq -r '.[].id')
        for REL_ID in $RELEASES; do
          if [ "$REL_ID" != "null" ] && [ -n "$REL_ID" ]; then
            echo "[*] Deleting previous release ID: $REL_ID..."
            curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/releases/$REL_ID
          fi
        done
        echo "[*] Previous releases purged successfully."

    - name: Publish Official Release On GitHub
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      with:
        tag_name: v1.0.0
        name: "Sms Auto Forwarder (Official Release)"
        make_latest: true
        body: |
          # 🟢 Sms Auto Forwarder (Official Release)

          ### What Is Included In This Release:
          - **Pure Sms Copy And Forward Engine (Zero Phone Call Access Required)**: Completely Removed Unneeded Permissions. The Application Exclusively Requests Standard Sms Access To Intercept Incoming Messages And Forward Them.
          - **Instant Permission Granting**: Single Tap Authorizes Sms Intercept And Dispatch Without Confusing Prompts.
          - **Direct Settings Recovery**: Direct Route To Application Settings If The System Blocks Repeated Dialogs.
          - **Optimized Top Bar Spacing**: Removed Excessive Hardcoded Top Padding, Adapting Responsively To Status Bars, Notches, And Cutouts.
          - **Enhanced Ui/Ux Typography**: Scaled All Font Sizes And Touch Targets For Superior Readability And Effortless Operation.
          - **Signed Production Release Apk (`app-release.apk`)**: Standalone Cryptographically Signed Release Build Without Debug Overhead (Recommended).
          - **Debug Apk (`app-debug.apk`)**: Diagnostic Developer Build.
          - **Autonomous 24/7 Background Forwarding Engine**: Operates Continuously In The Background Until Explicitly Stopped. Survives Device Reboots And App Task Swipes.
          - **Self-Executing Battery Optimization**: Autonomously Requests Battery Exemption Without Manual Settings Navigation.
          - **Direct Carrier Sim-To-Sim Routing**: Zero Cloud Dependencies, Completely Private, And Dispatches Over Cellular Sim Plan.

          ---
          ### 📲 Installation Guide:
          1. Download The Attached **`app-release.apk`** Below (Recommended).
          2. Transfer To Mother Phone And Install (*Allow Unknown Apps* If Prompted).
          3. Tap **"Grant"** On **"Sms Intercept And Dispatch"** And Select **"Allow"**.
          4. Enter Destination Phone Number, Tap **"Save Configuration"**, And Switch Toggle To **"Active"**.
        files: |
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
