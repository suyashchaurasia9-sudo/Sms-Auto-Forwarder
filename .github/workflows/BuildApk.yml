name: Build And Publish Android Apk

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile, Package And Publish Apk
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set Up Java Development Kit 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set Up Android Sdk Environment
      uses: android-actions/setup-android@v4

    - name: Ensure Gradle Wrapper Jar Exists
      run: |
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          echo "[*] Downloading official gradle-wrapper.jar..."
          mkdir -p gradle/wrapper
          curl -Lo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar
        fi

    - name: Make Gradle Wrapper Executable
      run: chmod +x gradlew

    - name: Generate Official Release Keystore
      run: |
        keytool -genkey -v -keystore app/release.keystore \
          -alias smsforwarder \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=SmsAutoForwarder, OU=Production, O=SmsForwarder, L=Global, S=Global, C=US"

    - name: Build Debug And Release Apks
      run: ./gradlew assembleDebug assembleRelease

    - name: Upload Debug Apk Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmsForwarder-Debug-Apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload Release Apk Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmsForwarder-Release-Apk
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 30

    - name: Publish Official Release On GitHub
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
      with:
        tag_name: v1.0.3
        name: "Sms Auto Forwarder v1.0.3 (Production Release)"
        make_latest: true
        body: |
          # 🟢 Sms Auto Forwarder v1.0.3 (Production Release)

          ### What Is Included In This Release:
          - **Pure SMS Copy & Forward Concept (No Telephony / Phone Call Permissions Required)**: Completely removed `READ_PHONE_STATE` from required permissions. The app now only requests standard SMS access ("Send and view SMS messages") to copy incoming messages and dispatch them.
          - **Instant Permission Granting**: Single tap allows SMS access without confusing "make and manage phone calls" prompts.
          - **Direct Settings Recovery**: If Android blocks the permission dialog, tapping "Grant" or the SMS row offers a direct 1-tap route to Settings.
          - **Signed Production Release APK (`app-release.apk`)**: Standalone signed production release without debug overhead (Recommended).
          - **Debug APK (`app-debug.apk`)**: Diagnostic developer package.
          - **Autonomous 24/7 Background Forwarding Engine**: Keeps running in the background until manually turned off. Survives app swipes and device reboots.
          - **Self-Executing Battery Optimization**: Automatically prompts and acquires battery optimization exemption without manual settings digging.
          - **Direct Carrier Sim-To-Sim Routing**: Zero cloud servers, 100% private, works completely offline via mother's cellular SMS plan.

          ---
          ### 📲 Installation Guide:
          1. Download the attached **`app-release.apk`** below (Recommended).
          2. Transfer it to your mother's phone and tap to install (*Allow Unknown Apps* if prompted).
          3. Tap **"Grant"** on **"Sms Intercept And Dispatch"** and tap **"Allow"**.
          4. Enter your phone number, tap **"Save Configuration"**, and toggle the switch to **"Active"**.
        files: |
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
